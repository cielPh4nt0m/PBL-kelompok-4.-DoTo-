<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="assets/js/theme.js"></script>
<script src="assets/js/mock-api.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%234fe3f0%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%233a8be6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%236a3fa8%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2236%22%20height%3D%2236%22%20rx%3D%2211%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Cpath%20d%3D%22M14%2010h7a10%2010%200%200%201%200%2020h-7z%22%20fill%3D%22%230f1e3d%22%20opacity%3D%22.85%22%2F%3E%3Cpath%20d%3D%22M18%2015l7%205-7%205z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<title>Doto – Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design.css">
<script type="module" src="assets/js/fe-shell.js"></script>
<script src="assets/js/cursor-glow.js" defer></script>
</head>
<body class="app-page">
<div class="app" id="app">
<main class="main set-main">
    <header class="set-top">
      <h1 class="set-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>SETTINGS</h1>
      <button type="button" class="bell" id="setBell" aria-label="Notifikasi"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5-6.7V3a2 2 0 1 0-4 0v1.3A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg><i></i></button>
    </header>
    <label class="set-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="setSearch" type="search" placeholder="Search" autocomplete="off" aria-label="Cari pengaturan"></label>
    <section class="set-group" aria-labelledby="setH">
      <h2 id="setH">Account Settings</h2>
      <p class="set-sub">Manage your account and workspace preferences.</p>
      <div class="set-list" id="setList">
        <button type="button" class="set-row" data-key="profile" data-kw="nama email foto avatar username name photo akun">
          <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
          <span class="set-txt"><b>Profile</b><small>Nama, email, foto profil</small></span>
          <svg class="set-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button type="button" class="set-row" data-key="notifications" data-kw="notifikasi pengingat deadline tenggat aktivitas reminder alert bell">
          <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span>
          <span class="set-txt"><b>Notifications</b><small>Pengingat deadline dan aktivitas tim</small></span>
          <svg class="set-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button type="button" class="set-row" data-key="appearance" data-kw="tema gelap terang dark light mode warna tampilan theme">
          <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 22a10 10 0 1 1 10-10c0 2.8-2.2 3.5-4 3.5h-2a2 2 0 0 0-1.5 3.3c.9 1 .2 3.2-2.5 3.2z"/></svg></span>
          <span class="set-txt"><b>Appearance</b><small>Tema dan tampilan aplikasi</small></span>
          <svg class="set-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button type="button" class="set-row" data-key="ai" data-kw="ai agen asisten persetujuan approval model agent preferensi">
          <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span>
          <span class="set-txt"><b>AI Preferences</b><small>Preferensi Agen AI DOTO</small></span>
          <svg class="set-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button type="button" class="set-row" data-key="security" data-kw="keamanan privasi password sandi token api sesi login security privacy data">
          <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span>
          <span class="set-txt"><b>Security & Privacy</b><small>Keamanan akun dan privasi data</small></span>
          <svg class="set-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div class="set-row set-lang" data-kw="bahasa language indonesia english inggris">
          <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
          <span class="set-txt"><b>Language</b><small>Pilih bahasa pilihan anda</small></span>
          <span class="set-seg" id="setLang" role="group" aria-label="Bahasa"><button type="button" data-lang="id" aria-pressed="true">Bahasa Indonesia</button><button type="button" data-lang="en" aria-pressed="false">English</button></span>
        </div>
        <p class="set-empty" id="setEmpty" hidden>Tidak ada pengaturan yang cocok.</p>
      </div>
    </section>
  </main>
</div>
</body>
</html>
