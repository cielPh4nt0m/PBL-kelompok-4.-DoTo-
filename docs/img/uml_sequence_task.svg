<rect x="105.9" y="131.0" width="193.2" height="34.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="202.5" y="141.2" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#1E3A5F">1. PATCH /tasks/K4-12/status</text>
<text x="202.5" y="154.8" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#1E3A5F">{status: &#x27;done&#x27;}</text>
<rect x="329.4" y="177.0" width="161.2" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="410.0" y="187.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#0F766E">2. resolveUser(request)</text>
<rect x="287.8" y="211.0" width="244.4" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="410.0" y="221.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#0F766E">3. AuthContext(user, channel, agent)</text>
<rect x="370.4" y="259.0" width="289.2" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="515.0" y="269.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#2563EB">4. updateTaskStatus(&#x27;K4-12&#x27;, &#x27;done&#x27;, actor)</text>
<polygon points="588,310 696,310 696,328 686,334 588,334" fill="#B45309"/>
<text x="638" y="322" text-anchor="middle" dominant-baseline="central" class="h-box" style="font-size:10.5px">transaction</text>
<rect x="753.6" y="314.0" width="218.8" height="20.0" rx="4" fill="#FFFBEB" stroke="none"/><text x="863.0" y="324.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#B45309">Database::transaction() — Atomik</text>
<rect x="742.1" y="341.0" width="250.8" height="34.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="867.5" y="351.2" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#B45309">5. SET @doto_actor_user_id,</text>
<text x="867.5" y="364.8" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#B45309">@doto_actor_channel, @doto_agent_name</text>
<rect x="751.7" y="397.0" width="231.6" height="34.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="867.5" y="407.2" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#2563EB">6. UPDATE tasks SET status=&#x27;done&#x27;,</text>
<text x="867.5" y="420.8" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#2563EB">status_changed_at = now</text>
<rect x="1070.9" y="451.0" width="193.2" height="34.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="1167.5" y="461.2" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#6D28D9">7a. BEFORE UPDATE:</text>
<text x="1167.5" y="474.8" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#6D28D9">trg_validate_task_assignment</text>
<rect x="1032.5" y="509.0" width="270.0" height="34.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="1167.5" y="519.2" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#6D28D9">7b. BEFORE UPDATE FOLLOWS:</text>
<text x="1167.5" y="532.8" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#6D28D9">trg_handle_task_completion (&#x27;scheduled&#x27;)</text>
<rect x="1026.1" y="567.0" width="282.8" height="34.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="1167.5" y="577.2" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#6D28D9">7c. AFTER UPDATE:</text>
<text x="1167.5" y="590.8" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#6D28D9">trg_log_task_status_change -&gt; task_history</text>
<rect x="1080.5" y="623.0" width="174.0" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="1167.5" y="633.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#6D28D9">8. Seluruh Trigger sukses</text>
<rect x="745.3" y="663.0" width="244.4" height="34.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="867.5" y="673.2" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#B45309">9. finally: SET @doto_actor_* = NULL</text>
<text x="867.5" y="686.8" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#B45309">&amp; COMMIT</text>
<rect x="716.5" y="733.0" width="302.0" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="867.5" y="743.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#1E293B">10. Kembalian baris v_task_detail + task_tags</text>
<rect x="447.2" y="785.0" width="135.6" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="515.0" y="795.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#2563EB">11. TaskDTO terbaru</text>
<rect x="115.5" y="832.0" width="174.0" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="202.5" y="842.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#1E3A5F">12. HTTP 200 JSON TaskDTO</text>
</svg>