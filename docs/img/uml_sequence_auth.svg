<rect x="95.2" y="145.0" width="199.6" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="195.0" y="155.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#1E3A5F">1. Klik &#x27;Sign in with Google&#x27;</text>
<rect x="319.8" y="177.0" width="180.4" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="410.0" y="187.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#0F766E">2. Pilih akun di popup GSI</text>
<rect x="313.4" y="209.0" width="193.2" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="410.0" y="219.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#0F766E">3. Kembalikan JWT credential</text>
<rect x="404.6" y="257.0" width="250.8" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="530.0" y="267.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#2563EB">4. POST /api/auth/google {credential}</text>
<rect x="542.0" y="292.0" width="206.0" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="645.0" y="302.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#0F766E">5. GET /tokeninfo?id_token=...</text>
<rect x="519.6" y="332.0" width="250.8" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="645.0" y="342.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#0F766E">6. Klaim valid (sub, email, aud, exp)</text>
<rect x="745.4" y="385.0" width="289.2" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="890.0" y="395.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#2563EB">7. findOrCreateGoogleUser(sub, email, name)</text>
<rect x="1027.8" y="438.0" width="244.4" height="20.0" rx="4" fill="#F8FAFC" stroke="none"/><text x="1150.0" y="448.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#1E3A5F">[google_sub / email sudah terdaftar]</text>
<rect x="1054.5" y="458.0" width="206.0" height="34.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="1157.5" y="468.2" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#B45309">8a. SELECT / UPDATE google_sub</text>
<text x="1157.5" y="481.8" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#B45309">&amp; email_verified = 1</text>
<rect x="986.8" y="538.0" width="148.4" height="20.0" rx="4" fill="#F8FAFC" stroke="none"/><text x="1061.0" y="548.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#1E3A5F">[else: pengguna baru]</text>
<rect x="1032.1" y="557.0" width="250.8" height="34.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="1157.5" y="567.2" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#B45309">8b. INSERT users (password_hash=NULL,</text>
<text x="1157.5" y="580.8" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#B45309">team_key=&#x27;K4&#x27;, email_verified=1)</text>
<rect x="1051.3" y="631.0" width="212.4" height="34.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="1157.5" y="641.2" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#B45309">9. ensureUserInK4Project():</text>
<text x="1157.5" y="654.8" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#B45309">cek &amp; INSERT project_members K4</text>
<rect x="1038.5" y="677.0" width="238.0" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="1157.5" y="687.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#1E293B">10. User + keanggotaan K4 tersimpan</text>
<rect x="780.6" y="722.0" width="218.8" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="890.0" y="732.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#2563EB">11. Authenticator::logIn(userId)</text>
<rect x="761.4" y="762.0" width="257.2" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="890.0" y="772.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#2563EB">12. Sesi aktif (session_regenerate_id)</text>
<rect x="343.8" y="805.0" width="372.4" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="530.0" y="815.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#1E3A5F">13. HTTP 200 MeDTO + Set-Cookie: doto_session (HttpOnly)</text>
<rect x="98.4" y="845.0" width="193.2" height="20.0" rx="4" fill="#FFFFFF" stroke="none"/><text x="195.0" y="855.0" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#1E3A5F">14. Redirect ke welcome.html</text>
