<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="assets/js/theme.js"></script>
<script src="assets/js/mock-api.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%234fe3f0%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%233a8be6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%236a3fa8%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2236%22%20height%3D%2236%22%20rx%3D%2211%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Cpath%20d%3D%22M14%2010h7a10%2010%200%200%201%200%2020h-7z%22%20fill%3D%22%230f1e3d%22%20opacity%3D%22.85%22%2F%3E%3Cpath%20d%3D%22M18%2015l7%205-7%205z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<title>Doto – Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design.css">
<script type="module" src="assets/js/pages/calendar.js"></script>
<script src="assets/js/cursor-glow.js" defer></script>
</head>
<body class="app cal-page">
<main class="page cal-main" id="content">
    <div class="cal-wrap">
      <section class="cal-card" aria-label="Kalender tenggat tugas">
        <header class="cal-head">
          <div class="cal-nav">
            <button type="button" id="calPrev" aria-label="Bulan sebelumnya">‹</button>
            <h1 id="calTitle"></h1>
            <button type="button" id="calNext" aria-label="Bulan berikutnya">›</button>
          </div>
          <button type="button" id="calToday" class="cal-today">Hari ini</button>
        </header>
        <div class="cal-dow" id="calDow"></div>
        <div class="cal-grid" id="calGrid"></div>
      </section>
      <aside class="cal-side" id="calSide" aria-label="Anggota tim dan jadwal terdekat">
        <button type="button" class="cal-toggle" id="calToggle" aria-expanded="false" aria-label="Buka panel jadwal">‹</button>
        <div class="cal-side-in">
          <h2>Anggota tim</h2>
          <div class="cal-members" id="calMembers"></div>
          <h2>Jadwal terdekat</h2>
          <div class="cal-upcoming" id="calUpcoming"></div>
          <h2 class="cal-legend-h">Keterangan</h2>
          <div class="cal-legend" id="calLegend"></div>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
