<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="assets/js/theme.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%234fe3f0%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%233a8be6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%236a3fa8%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2236%22%20height%3D%2236%22%20rx%3D%2211%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Cpath%20d%3D%22M14%2010h7a10%2010%200%200%201%200%2020h-7z%22%20fill%3D%22%230f1e3d%22%20opacity%3D%22.85%22%2F%3E%3Cpath%20d%3D%22M18%2015l7%205-7%205z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<title>Doto – Security &amp; Privacy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design.css">
<script type="module" src="assets/js/fe-shell.js"></script>
<script src="assets/js/cursor-glow.js" defer></script>
</head>
<body class="app-page">
<div class="app" id="app">
<main class="main pf-main">
    <header class="pf-top">
      <div class="pg-head"><a class="pg-back" href="settings.html" aria-label="Kembali ke Settings" title="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5.5L10 12l4 6.5"/></svg></a><div><h1>Security &amp; Privacy</h1><p>Kelola kata sandi, token API, dan keamanan sesi akun Anda</p></div></div>
      <button type="button" class="bell" id="secBell" aria-label="Notifikasi"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5-6.7V3a2 2 0 1 0-4 0v1.3A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg><i></i></button>
    </header>
    <form id="secForm" class="editing" novalidate>
      <section class="pf-sec">
        <div class="pf-sico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <div class="pf-body">
          <h2>A. Ganti Password</h2>
          <p id="secPassSub" style="margin:0 0 14px;font-size:.86rem;color:var(--mute)">Perbarui password akun Anda secara berkala untuk menjaga keamanan.</p>
          <div class="pf-grid pf-b">
            <label class="pf-field" id="secCurWrap">
              <span class="pf-lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"/></svg><span>Password Saat Ini</span></span>
              <input id="secCur" type="password" placeholder="Masukkan password lama" autocomplete="current-password">
              <small class="pf-msg" id="secCur-msg" role="alert" hidden></small>
            </label>
            <label class="pf-field">
              <span class="pf-lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Password Baru</span></span>
              <input id="secNew" type="password" placeholder="Minimal 6 karakter" autocomplete="new-password">
              <small class="pf-msg" id="secNew-msg" role="alert" hidden></small>
            </label>
            <label class="pf-field">
              <span class="pf-lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><rect x="3" y="11" width="18" height="11" rx="2"/></svg><span>Konfirmasi Password Baru</span></span>
              <input id="secConf" type="password" placeholder="Ulangi password baru" autocomplete="new-password">
              <small class="pf-msg" id="secConf-msg" role="alert" hidden></small>
            </label>
          </div>
          <div class="pf-actions" style="margin-top:16px">
            <button type="button" class="pf-btn pf-edit" id="secToggleShow">Tampilkan Password</button>
            <button type="submit" class="pf-btn pf-save" id="secSaveBtn">Simpan Password Baru</button>
          </div>
        </div>
      </section>

      <section class="pf-sec">
        <div class="pf-sico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.6 7.6a6.5 6.5 0 1 1-5.3-5.3L14 14l2-2 2 2 3-3-2-2 2-2z"/></svg></div>
        <div class="pf-body">
          <h2>B. API Tokens &amp; Sesi</h2>
          <p style="margin:0 0 14px;font-size:.86rem;color:var(--mute)">Kelola token integrasi CLI / MCP atau akhiri sesi login saat ini.</p>
          <div class="pf-actions">
            <a class="pf-btn pf-edit" href="tokens.html" style="text-decoration:none">Kelola API Tokens →</a>
            <button type="button" class="pf-btn pf-cancel" id="secLogoutBtn">Logout dari Sesi Ini</button>
          </div>
        </div>
      </section>
    </form>
  </main>
</div>
</body>
</html>
