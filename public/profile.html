<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="assets/js/theme.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%234fe3f0%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%233a8be6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%236a3fa8%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2236%22%20height%3D%2236%22%20rx%3D%2211%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Cpath%20d%3D%22M14%2010h7a10%2010%200%200%201%200%2020h-7z%22%20fill%3D%22%230f1e3d%22%20opacity%3D%22.85%22%2F%3E%3Cpath%20d%3D%22M18%2015l7%205-7%205z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<title>Doto – Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design.css">
<script type="module" src="assets/js/fe-shell.js"></script>
<script src="assets/js/cursor-glow.js" defer></script>
</head>
<body class="app-page">
<div class="app" id="app">
<main class="main pf-main">
    <header class="pf-top">
      <div class="pg-head"><a class="pg-back" href="settings.html" aria-label="Kembali ke Settings" title="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5.5L10 12l4 6.5"/></svg></a><div><h1 data-i18n="title">Profil</h1><p data-i18n="sub">Lihat dan kelola informasi profil Anda</p></div></div>
      <button type="button" class="bell" id="pfBell" aria-label="Notifikasi"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5-6.7V3a2 2 0 1 0-4 0v1.3A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg><i></i></button>
    </header>
    <form id="pfForm" novalidate>
      <section class="pf-sec">
        <div class="pf-sico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
        <div class="pf-body">
          <h2 data-i18n="secA">A. Informasi Profil</h2>
          <div class="pf-verify" id="pfVerify" hidden role="status"><div><b id="pfVerifyTxt"></b><small data-i18n="verifyNote"></small></div><button type="button" class="pf-btn pf-save" id="pfVerifyBtn" data-i18n="verifyBtn">Klik untuk verifikasi</button></div>
          <div class="pf-a">
            <div class="pf-photo"><div class="pf-av" id="pfAvatar" aria-label="Foto profil"></div>
              <button type="button" class="pf-link" id="pfPhotoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-i18n="photo">Ganti Foto</span></button><input type="file" id="pfFile" accept="image/*" hidden></div>
            <div class="pf-grid">
              <label class="pf-field"><span class="pf-lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-i18n="lName">Nama Lengkap</span></span><input id="pfName" type="text" placeholder="Nama lengkap Anda" data-i18n-ph="phName" readonly autocomplete="off" maxlength="60"><small class="pf-msg" id="pfName-msg" role="alert" hidden></small></label>
              <label class="pf-field"><span class="pf-lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 7.9"/></svg><span data-i18n="lUser">Username</span></span><input id="pfUser" type="text" placeholder="huruf kecil, angka, titik, _" data-i18n-ph="phUser" readonly autocomplete="off" maxlength="15" autocapitalize="none" spellcheck="false"><small class="pf-msg" id="pfUser-msg" role="alert" hidden></small></label>
              <label class="pf-field"><span class="pf-lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span data-i18n="lMail">Email</span></span><input id="pfMail" type="text" placeholder="nama@email.com" data-i18n-ph="phMail" readonly autocomplete="off" maxlength="120"><small class="pf-msg" id="pfMail-msg" role="alert" hidden></small></label>
              <label class="pf-field"><span class="pf-lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg><span data-i18n="lRole">Role Pengguna (bidang keahlian)</span></span><input id="pfRole" type="text" placeholder="Contoh: Engineer, Chef, Desainer..." data-i18n-ph="phRole" readonly autocomplete="off" maxlength="40" list="pfRoles"><small class="pf-msg" id="pfRole-msg" role="alert" hidden></small></label>
              <datalist id="pfRoles"><option value="Engineer"><option value="Developer"><option value="Designer"><option value="Project Manager"><option value="Chef"><option value="Dosen"><option value="Mahasiswa"><option value="Writer"></datalist>
              <label class="pf-field wide"><span class="pf-lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h14"/></svg><span data-i18n="lBio">Bio Singkat</span></span><textarea id="pfBio" rows="3" maxlength="200" placeholder="Tulis sedikit tentang diri Anda..." data-i18n-ph="phBio" readonly></textarea><small class="pf-count" id="pfCount">0/200</small><small class="pf-msg" id="pfBio-msg" role="alert" hidden></small></label>
            </div>
          </div>
        </div>
      </section>
      <section class="pf-sec">
        <div class="pf-sico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></div>
        <div class="pf-body">
          <h2 data-i18n="secB">B. Informasi Pekerjaan</h2>
          <div class="pf-grid pf-b">
            <label class="pf-field"><span class="pf-lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><circle cx="17" cy="9" r="2.5"/><path d="M18 14.5a5.5 5.5 0 0 1 4 5.5"/></svg><span data-i18n="lTeam">Nama Tim (tim utama)</span></span><select id="pfTeam"></select><small class="pf-msg" id="pfTeam-msg" role="alert" hidden></small></label>
            <label class="pf-field"><span class="pf-lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-i18n="lJoined">Tanggal Bergabung</span></span><input id="pfJoined" type="text" readonly data-lock autocomplete="off" ><small class="pf-msg" id="pfJoined-msg" role="alert" hidden></small></label>
            <div class="pf-field wide"><span class="pf-lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span data-i18n="lProjects">Daftar Proyek yang Diikuti (opsional)</span></span><div class="pf-projects" id="pfProjects"></div></div>
          </div>
        </div>
      </section>
      <section class="pf-sec">
        <div class="pf-sico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg></div>
        <div class="pf-body">
          <h2 data-i18n="secC">C. Aksi Profil</h2>
          <div class="pf-actions">
            <button type="button" class="pf-btn pf-edit" id="pfEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg><span data-i18n="bEdit">Edit Profil</span></button>
            <button type="button" class="pf-btn pf-save" id="pfSave" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12l4 4v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v6h8V3M7 21v-7h10v7"/></svg><span data-i18n="bSave">Simpan Perubahan</span></button>
            <button type="button" class="pf-btn pf-cancel" id="pfCancel" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-i18n="bCancel">Batalkan</span></button>
          </div>
        </div>
      </section>
    </form>
  </main>
</div>
</body>
</html>
